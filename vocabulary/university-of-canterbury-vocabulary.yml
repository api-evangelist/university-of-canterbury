vocabulary:
  name: University of Canterbury Figshare API Vocabulary
  description: >-
    Controlled vocabulary for the key terms exposed by the figshare REST API
    that backs the Canterbury Figshare research data repository. Terms are drawn
    directly from the figshare OpenAPI definition (api.figshare.com/v2) and the
    OAI-PMH / DSpace context of the University of Canterbury research infrastructure.
  version: "1.0.0"
  terms:
    - term: Article
      definition: >-
        The primary unit of research output in figshare (a dataset, paper,
        media, software, poster, etc.), identified by an integer id and a DOI.
      tags: [object, scholarly, core]
    - term: Collection
      definition: >-
        A curated grouping of related figshare articles, identified by an
        integer id and its own DOI and handle.
      tags: [object, scholarly]
    - term: Project
      definition: >-
        A collaborative workspace grouping figshare articles and collaborators.
      tags: [object, collaboration]
    - term: DOI
      definition: >-
        Digital Object Identifier minted for an article or collection to enable
        persistent citation (e.g. 10.6084/m9.figshare.1434614).
      tags: [identifier, citation]
    - term: handle
      definition: >-
        Handle System persistent identifier assigned to a figshare object.
      tags: [identifier]
    - term: defined_type
      definition: >-
        Integer code classifying the article type; paired with defined_type_name
        (e.g. dataset, software, media, figure).
      tags: [enumeration, classification]
    - term: Timeline
      definition: >-
        Set of publishing lifecycle dates for an object (posted, submission,
        revision, firstOnline, publisherPublication, publisherAcceptance).
      tags: [object, dates]
    - term: institution_id
      definition: >-
        Numeric identifier used to scope figshare queries to a specific
        institution such as the University of Canterbury.
      tags: [parameter, scoping]
    - term: OAI-PMH
      definition: >-
        Open Archives Initiative Protocol for Metadata Harvesting, the
        standardized metadata harvesting interface exposed by both the UC
        Research Repository and the Canterbury Figshare instance.
      tags: [protocol, metadata, harvesting]
    - term: DSpace
      definition: >-
        The DSpace 7 platform powering the UC Research Repository, providing a
        REST API and OAI-PMH endpoint over communities, collections and items.
      tags: [platform, repository]
