  - date: '2026-06-03'
    rating: 2
    summary: >-
      University of Canterbury has no unified public developer portal. Verified
      live: the UC Research Repository (DSpace 7) OAI-PMH 2.0 endpoint returned a
      valid Identify response (HTTP 200), and figshare's public REST API and
      OAI-PMH endpoints (used by Canterbury Figshare) returned HTTP 200. The
      DSpace REST API root and the Engineering GitLab REST API exist but
      responded 403/401 to unauthenticated probes (gated, not public). The
      Canterbury Figshare portal returned a Cloudflare 202 challenge to
      automated requests. The UCCSER GitHub organization is real (31 public
      repos) but is a research group, not a university API program. No endpoints
      were fabricated; gated and challenge responses are reported as observed.
    endpoints:
      - url: https://ir.canterbury.ac.nz/server/oai/request?verb=Identify
        status: 200
        note: UC Research Repository DSpace 7 OAI-PMH 2.0 Identify; valid XML, repositoryName "UC Research Repository".
      - url: https://ir.canterbury.ac.nz/dspace-oai/request?verb=Identify
