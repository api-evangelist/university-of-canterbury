description: >-
  University of Canterbury (Te Whare Wananga o Waitaha) is a public research university in
  Christchurch, Aotearoa New Zealand. It operates no public developer programme, no developer
  portal and no published, self-serve API: everything machine-readable it runs is infrastructure
  for a purpose other than being an API product. What is genuinely institution-operated and
  genuinely readable is narrow — the UC Research Repository (a self-hosted DSpace 7 on
  ir.canterbury.ac.nz) serves a live OAI-PMH 2.0 interface with thirteen metadata formats, and
  three Shibboleth Service Providers on canterbury.ac.nz hosts publish valid SAML 2.0 metadata as
  members of Tuakiri, the New Zealand Access Federation. The rest is gated rather than absent: a
  CA API Gateway 9.0 answers on api.canterbury.ac.nz with no routed public service, a self-hosted
  GitLab serves an authenticated v4 API to the College of Engineering, and the DSpace REST API sits
  behind a Cloudflare bot challenge. The institution's research data repository and its identity
  provider are both tenancies on other people's platforms — Figshare and REANNZ's Tuakiri Hosted
  IdP respectively — and are recorded here as relationships, not as University of Canterbury
  contracts. This profile was corrected on 2026-08-30: eleven entries previously listed under this
  institution were a single Figshare API v2 contract, split by tag, and have been removed.
