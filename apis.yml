- aid: university-of-canterbury:api-gateway
  name: UC API Gateway
  x-operator: institution
  description: >-
    An institution-operated enterprise API gateway on the University of Canterbury's own registrable
    domain. Discovered 2026-08-30. Every probed path (/, /ping, /v1, /swagger) returns HTTP 500 with a
    SOAP fault from CA-API-Gateway/9.0 — faultstring "Policy Falsified", policyResult "Service Not
    Found. The request may have been sent to an invalid URL, or intended for an unsupported
    operation." The gateway itself is live and terminates TLS with HSTS (max-age=31536000,
    includeSubDomains); no service is routed to an unauthenticated caller and no catalogue,
    documentation or specification is published for what sits behind it. This is a real
    institution-operated API surface with a zero-size public footprint.
