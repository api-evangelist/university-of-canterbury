apis:
- aid: university-of-canterbury:research-repository-oai
  name: UC Research Repository OAI-PMH
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for the UC Research Repository, a DSpace 7 institutional
    repository of theses, dissertations and research outputs. Verified live (HTTP 200) returning a valid
    Identify response with repositoryName "UC Research Repository" and base URL https://ir.canterbury.ac.nz/server/oai/request.
  humanURL: https://ir.canterbury.ac.nz/
  baseURL: https://ir.canterbury.ac.nz/server/oai/request
  tags:
  - Research
  - Repository
  - OAI-PMH
  - DSpace
  - Metadata
  - Open Access
  properties:
  - type: Documentation
    url: https://ir.canterbury.ac.nz/
  - type: Authentication
    url: https://ir.canterbury.ac.nz/server/oai/request?verb=Identify
- aid: university-of-canterbury:research-repository-rest
  name: UC Research Repository DSpace REST API
  description: >-
    DSpace 7 REST API backing the UC Research Repository, providing programmatic access to communities,
    collections and items. The API root (https://ir.canterbury.ac.nz/server/api) is part of the standard
    DSpace 7 platform; it returned HTTP 403 to unauthenticated probes during review, so access conditions
    were not fully confirmed.
  humanURL: https://ir.canterbury.ac.nz/
  baseURL: https://ir.canterbury.ac.nz/server/api
  tags:
  - Research
  - Repository
  - DSpace
  - REST
  - Metadata
  properties:
  - type: Documentation
    url: https://ir.canterbury.ac.nz/
- aid: university-of-canterbury:eng-git-gitlab
  name: UC Engineering GitLab API
  description: >-
    Self-hosted GitLab instance operated by the University of Canterbury College of Engineering. The web
    application is reachable (HTTP 200) and the GitLab REST API v4 is present (HTTP 401 to unauthenticated
    calls, indicating an authentication-gated GitLab API rather than a public one).
  humanURL: https://eng-git.canterbury.ac.nz/
  baseURL: https://eng-git.canterbury.ac.nz/api/v4
  tags:
  - GitLab
  - Source Code
  - Engineering
  - REST
  - Authentication
  properties:
  - type: Documentation
    url: https://eng-git.canterbury.ac.nz/
  - type: Authentication
    url: https://eng-git.canterbury.ac.nz/api/v4/version
