  detail: >-
    The University of Canterbury operates no public developer programme, no developer portal and no
    self-serve public API, and this profile now says so. What it does operate and what we could read
    has been found and recorded: a live OAI-PMH 2.0 interface on a self-hosted DSpace 7, and three
    Shibboleth SAML 2.0 Service Provider metadata endpoints on institution hosts. Three further
    institution-operated surfaces are live but closed to us — a CA API Gateway 9.0 on
    api.canterbury.ac.nz routing no public service (HTTP 500 Policy Falsified), a self-hosted GitLab
    v4 API (HTTP 401), and the DSpace REST API behind a Cloudflare bot challenge (HTTP 403). Two
    surfaces are tenancies on other people's platforms and are recorded as relationships, not as
    this institution's contracts: the Tuakiri Hosted IdP and canterbury.figshare.com. No AI policy
    or responsible-AI statement was found in the UC Policy Library. No llms.txt and no security.txt
    are published. This profile is thin because the institution genuinely publishes little, not
    because we were blocked — the correction on 2026-08-30 removed 47 files carrying a Figshare API
    v2 contract that had been attributed to this institution since 2026-06-03.
